<script>
  /* Apply saved theme before first paint to avoid a flash of the wrong theme. Default: dark. */
  (function(){
    try{
      var t = localStorage.getItem('fer-theme');
      document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    }catch(e){
      document.documentElement.setAttribute('data-theme','dark');
    }
  })();

  align-items:center;
  justify-content:space-between;
  padding:14px 20px;

  background:var(--ink-2);

.toolbar{

<script type="text/javascript">

const swalTheme = Swal.mixin({
  customClass:{ popup:'fer-popup' },
  background:'var(--ink-2)',
  color:'var(--text-hi)',
  confirmButtonColor:'#b0442f',
  cancelButtonColor:'#2c3240',
  buttonsStyling:true
});

/* theme: dark (default) / light, persisted in localStorage */
function updateThemeIcon(theme){
  const btn = document.getElementById('themeToggle');
  if(!btn) return;
  btn.className = theme === 'dark' ? 'bi bi-moon-stars-fill' : 'bi bi-sun-fill';
  btn.title = theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
}

function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('fer-theme', next); }catch(e){}
  updateThemeIcon(next);
}

updateThemeIcon(document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark');

let ferProgTimer = null;

function showProcessing(title){
  swalTheme.fire({
    title:title,
    html:`<img src="venom-load.gif" class="fer-load-mark" alt="">
          <div class="fer-progress"><div class="fer-progress-bar" id="ferBar"></div></div>`,
    allowOutsideClick:false,
    allowEscapeKey:false,
    showConfirmButton:false,
    didOpen:()=>{
      let bar = document.getElementById('ferBar');
      let w = 0;
      ferProgTimer = setInterval(()=>{
        w = Math.min(w + Math.random()*20, 92);
        if(bar) bar.style.width = w + '%';
      }, 150);
    }
  });
}

function hideProcessing(){
  if(ferProgTimer){ clearInterval(ferProgTimer); ferProgTimer = null; }
  Swal.close();
}

function toast(icon, title, text){
  swalTheme.fire({icon:icon, title:title, text:text});
}

async function askPassword(title){
  const { value: pw } = await swalTheme.fire({
    title:title,
    icon:'question',
    iconHtml:'<i class="bi bi-shield-lock-fill"></i>',
    iconColor:'#b0442f',
    input:'password',
    inputPlaceholder:'Enter password',
    inputAttributes:{ autocapitalize:'off', autocorrect:'off' },
    showCancelButton:true,
    confirmButtonText:'Continue',
    inputValidator:(v)=> !v ? 'Password cannot be empty' : undefined
  });
  return pw;
}

function speakingUtterance(){ return window.__ferUtterance; }

function spea(x) {
  const media = document.getElementById("audioid") || document.getElementById("videoid");

  if (media) {
    if (x.id === "play") {
      media.play();
      x.id = "pause";
      x.className = "bi bi-pause-fill";
      media.onended = function () {
        x.id = "play";
        x.className = "bi bi-play-fill";
      };
    } else {
      media.pause();
      x.id = "play";
      x.className = "bi bi-play-fill";
    }
    return;
  }

  if (x.id === "play") {
    let sv = document.getElementById("pyy").textContent;
    if(!sv || !sv.trim()){
      toast('info','Nothing to read','Add some text first.');
      return;
    }
    let spp = new SpeechSynthesisUtterance(sv);
    window.__ferUtterance = spp;
    spp.lang = navigator.language || "en-US";
    speechSynthesis.speak(spp);
    x.id = "pause";
    x.className = "bi bi-pause-fill";
    spp.onend = function () {
      x.id = "play";
      x.className = "bi bi-play-fill";
    };
  } else {
    if (speechSynthesis.speaking) {
      speechSynthesis.cancel();
    }
    x.id = "play";
    x.className = "bi bi-play-fill";
  }
}

let pas = "";
let ferPendingFile = null;
let ferPendingText = null;
let ferEncryptedBlob = null;
let ferEncryptedName = null;
let ferDecryptedBlob = null;
let ferDecryptedName = null;
let ferObjectUrl = null;

/*
  FER v3 binary container
  - No Base64 for files
  - No encrypted MB/GB strings in the DOM
  - File is processed in chunks
  - Each chunk gets a unique AES-GCM IV and authentication tag
*/
const FER_MAGIC = new TextEncoder().encode("FER3");
const FER_VERSION = 3;
const FER_CHUNK_SIZE = 1024 * 1024; // 1 MiB
const FER_ITERATIONS = 150000;

function ferU32(n){
  const b=new Uint8Array(4), v=new DataView(b.buffer);
  v.setUint32(0,n,false); return b;
}
function ferReadU32(buf, off){ return new DataView(buf,off,4).getUint32(0,false); }
function ferConcat(parts){
  return new Blob(parts,{type:"application/octet-stream"});
}
function ferStatus(text){
  const p=document.getElementById("pyy");
  p.textContent=text;
  p.contentEditable="false";
}
function ferSetProgress(done,total){
  const bar=document.getElementById('ferBar');
  if(bar && total) bar.style.width=Math.min(100,(done/total)*100).toFixed(1)+'%';
}
async function ferDeriveKey(password,salt,usage){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(password),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey(
    {name:"PBKDF2",salt,iterations:FER_ITERATIONS,hash:"SHA-256"},
    km,{name:"AES-GCM",length:256},false,[usage]
  );
}

/* Small text payloads remain convenient text; large files use FER3 binary. */
async function ferEncryptText(plaintext,password){
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await ferDeriveKey(password,salt,"encrypt");
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(plaintext));
  const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
  return JSON.stringify({v:3,t:"txt",s:b64(salt),iv:b64(iv),ct:b64(ct)});
}
async function ferDecryptText(payloadStr,password){
  const p=JSON.parse(payloadStr);
  if(p.t!=="txt") throw new Error("not text");
  const from64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
  const salt=from64(p.s), iv=from64(p.iv), ct=from64(p.ct).buffer;
  const key=await ferDeriveKey(password,salt,"decrypt");
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);
  return new TextDecoder().decode(plain);
}

/*
 Header:
 magic(4) version(1) salt(16) chunkSize(4) chunkCount(4)
 nameLength(4) mimeLength(4) originalSize(8)
 name UTF-8, mime UTF-8
 Then repeated: ciphertextLength(4), ciphertext bytes
*/
async function ferEncryptFile(file,password){
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const key=await ferDeriveKey(password,salt,"encrypt");
  const nameBytes=new TextEncoder().encode(file.name);
  const mimeBytes=new TextEncoder().encode(file.type||"application/octet-stream");
  const chunks=Math.ceil(file.size/FER_CHUNK_SIZE);
  const header=new Uint8Array(45);
  header.set(FER_MAGIC,0);
  header[4]=FER_VERSION;
  header.set(salt,5);
  new DataView(header.buffer).setUint32(21,FER_CHUNK_SIZE,false);
  new DataView(header.buffer).setUint32(25,chunks,false);
  new DataView(header.buffer).setUint32(29,nameBytes.length,false);
  new DataView(header.buffer).setUint32(33,mimeBytes.length,false);
  new DataView(header.buffer).setBigUint64(37,BigInt(file.size),false);

  const parts=[header,nameBytes,mimeBytes];
  for(let i=0;i<chunks;i++){
    const start=i*FER_CHUNK_SIZE;
    const plain=await file.slice(start,Math.min(start+FER_CHUNK_SIZE,file.size)).arrayBuffer();
    const iv=crypto.getRandomValues(new Uint8Array(12));
    // Authenticate the chunk number too, preventing chunk reordering.
    const aad=ferU32(i);
    const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv,additionalData:aad},key,plain);
    const recordLen=12+ct.byteLength;
    parts.push(ferU32(recordLen),iv,new Uint8Array(ct));
    ferSetProgress(i+1,chunks);
    if(i%8===0) await new Promise(requestAnimationFrame);
  }
  return ferConcat(parts);
}

async function ferDecryptFile(file,password){
  const fixed=await file.slice(0,45).arrayBuffer();
  if(fixed.byteLength<45) throw new Error("Invalid FER file");
  const h=new Uint8Array(fixed);
  if(String.fromCharCode(...h.slice(0,4))!=="FER3" || h[4]!==3) throw new Error("Unsupported file format");
  const salt=h.slice(5,21);
  const chunkSize=ferReadU32(fixed,21);
  const chunks=ferReadU32(fixed,25);
  const nameLen=ferReadU32(fixed,29);
  const mimeLen=ferReadU32(fixed,33);
  const meta=await file.slice(45,45+nameLen+mimeLen).arrayBuffer();
  const mb=new Uint8Array(meta);
  const dec=new TextDecoder();
  const name=dec.decode(mb.slice(0,nameLen));
  const mime=dec.decode(mb.slice(nameLen,nameLen+mimeLen))||"application/octet-stream";
  const key=await ferDeriveKey(password,salt,"decrypt");
  let pos=45+nameLen+mimeLen;
  const parts=[];
  for(let i=0;i<chunks;i++){
    const lenBuf=await file.slice(pos,pos+4).arrayBuffer();
    if(lenBuf.byteLength!==4) throw new Error("Corrupt chunk length");
    const len=ferReadU32(lenBuf,0);
    const rec=await file.slice(pos+4,pos+4+len).arrayBuffer();
    if(rec.byteLength!==len || len<28) throw new Error("Corrupt chunk");
    const iv=new Uint8Array(rec,0,12);
    const ct=rec.slice(12);
    const plain=await crypto.subtle.decrypt(
      {name:"AES-GCM",iv,additionalData:ferU32(i)},key,ct
    );
    parts.push(new Uint8Array(plain));
    pos+=4+len;
    ferSetProgress(i+1,chunks);
    if(i%8===0) await new Promise(requestAnimationFrame);
  }
  return {blob:new Blob(parts,{type:mime}),name,mime,size:chunkSize};
}

function ferDownload(blob,name){
  const u=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=u; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(u),1000);
}

async function ennx(x){
  const title=x==='e'?'Enter a password to conceal':'Enter the password to reveal';
  const pw=await askPassword(title); if(!pw)return;
  pas=pw;
  document.getElementById("inpp").querySelectorAll('.btn').forEach(b=>b.disabled=true);
  showProcessing(x==='e'?'Concealing securely…':'Revealing securely…');
  await new Promise(r=>setTimeout(r,50));
  try{
    if(x==='e') await enn(); else await ddd();
  }catch(err){
    hideProcessing();
    console.error(err);
    toast('error',x==='e'?'Concealing failed':'Reveal failed',err.message||'The file could not be processed.');
  }finally{
    pas="";
    document.getElementById("inpp").querySelectorAll('.btn').forEach(b=>b.disabled=false);
  }
}

document.getElementById("ii").addEventListener("change",async e=>{
  const file=e.target.files[0]; e.target.value="";
  if(!file)return;
  if(file.name.toLowerCase().endsWith(".fer")){
    ferPendingFile=file; ferPendingText=null;
    ferStatus(`Encrypted file ready: ${file.name}\nSize: ${(file.size/1048576).toFixed(2)} MB\n\nPress Reveal to decrypt.`);
    return;
  }
  if(file.type.startsWith("text/") && file.size<=10*1024*1024){
    ferPendingFile=null;
    const text=await file.text();
    ferPendingText=text;
    document.getElementById("pyy").textContent=text;
    document.getElementById("pyy").contentEditable="true";
    return;
  }
  // Keep the File object: do NOT read the whole file into RAM.
  ferPendingFile=file; ferPendingText=null;
  ferStatus(`Ready to encrypt: ${file.name}\nSize: ${(file.size/1048576).toFixed(2)} MB\n\nProcessed in 1 MiB authenticated chunks. The whole file is never loaded into memory at once.`);
  ennx('e');
});

async function enn(){
  if(ferPendingFile){
    const out=await ferEncryptFile(ferPendingFile,pas);
    ferEncryptedBlob=out;
    ferEncryptedName=ferPendingFile.name+".fer";
    ferStatus(`✓ Encryption complete\n\nOriginal: ${ferPendingFile.name}\nEncrypted: ${ferEncryptedName}\nSize: ${(out.size/1048576).toFixed(2)} MB\n\nUse Download to save the encrypted binary file.`);
    ferPendingFile=null;
    return;
  }
  const text=ferPendingText!==null?ferPendingText:document.getElementById("pyy").textContent;
  const encoded=await ferEncryptText(text,pas);
  document.getElementById("pyy").textContent=encoded;
  document.getElementById("pyy").contentEditable="true";
  ferPendingText=null;
}

async function ddd(){
  if(ferPendingFile && ferPendingFile.name.toLowerCase().endsWith(".fer")){
    const result=await ferDecryptFile(ferPendingFile,pas);
    ferDecryptedBlob=result.blob;
    ferDecryptedName=result.name;
    ferStatus(`✓ Decryption complete\n\nFile: ${result.name}\nType: ${result.mime}\nSize: ${(result.blob.size/1048576).toFixed(2)} MB\n\nUse Download to save the original file.`);
    ferPendingFile=null;
    return;
  }
  const text=await ferDecryptText(document.getElementById("pyy").textContent,pas);
  document.getElementById("pyy").textContent=text;
  document.getElementById("pyy").contentEditable="true";
}

async function pri(){
  if(ferEncryptedBlob){ ferDownload(ferEncryptedBlob,ferEncryptedName||"encrypted.fer"); return; }
  if(ferDecryptedBlob){ ferDownload(ferDecryptedBlob,ferDecryptedName||"decrypted.bin"); return; }
  const con=document.getElementById("pyy").textContent;
  if(!con.trim()){toast('info','Nothing to download','Add some content first.');return;}
  const {value:name}=await swalTheme.fire({title:'Download text',input:'text',inputValue:'ferdinand.txt',showCancelButton:true});
  if(name) ferDownload(new Blob([con],{type:"text/plain"}),name);
}

async function shr(x){
  const blob=ferEncryptedBlob||ferDecryptedBlob;
  const name=ferEncryptedBlob?ferEncryptedName:ferDecryptedName;
  if(x==='fs' && blob && navigator.share){
    try{await navigator.share({files:[new File([blob],name,{type:blob.type||"application/octet-stream"})]});}catch(e){}
    return;
  }
  const con=document.getElementById("pyy").textContent;
  if(!con.trim()){toast('info','Nothing to share','Add some content first.');return;}
  if(!navigator.share){toast('info','Sharing unavailable','Your browser does not support sharing.');return;}
  try{await navigator.share({text:con});}catch(e){}
}

/* --- animated particle background --- */
function ferParticleColors(theme){
  return theme === 'light'
    ? { particle:'#a83d29', line:'#8f8874' }
    : { particle:'#c85640', line:'#4a5265' };
}

function initFerParticles(theme){
  if(typeof particlesJS === 'undefined') return;
  const c = ferParticleColors(theme);
  particlesJS('particles-js', {
    particles:{
      number:{ value:60, density:{ enable:true, value_area:900 } },
      color:{ value:c.particle },
      shape:{ type:'circle' },
      opacity:{ value:0.45, random:true, anim:{ enable:true, speed:0.4, opacity_min:0.1, sync:false } },
      size:{ value:2.5, random:true },
      line_linked:{ enable:true, distance:130, color:c.line, opacity:0.35, width:1 },
      move:{ enable:true, speed:1, direction:'none', random:true, straight:false, out_mode:'out', bounce:false }
    },
    interactivity:{
      detect_on:'canvas',
      events:{
        onhover:{ enable:true, mode:'grab' },
        onclick:{ enable:true, mode:'push' },
        resize:true
      },
      modes:{
        grab:{ distance:140, line_linked:{ opacity:0.6 } },
        push:{ particles_nb:3 }
      }
    },
    retina_detect:true
  });
}

initFerParticles(document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark');

/* re-theme particles whenever the user switches dark/light */
const ferOrigToggleTheme = toggleTheme;
toggleTheme = function(){
  ferOrigToggleTheme();
  const t = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  if(window.pJSDom && window.pJSDom.length){
    window.pJSDom.forEach(p => p.pJS.fn.vendors.destroypJS());
    window.pJSDom = [];
  }
  initFerParticles(t);
};

async function impo(){
  const { value: userU } = await swalTheme.fire({
    title:'Import from link',
    icon:'question',
    iconHtml:'<i class="bi bi-link-45deg"></i>',
    iconColor:'#b0442f',
    input:'url',
    inputPlaceholder:'https://example.com/file.txt',
    showCancelButton:true,
    confirmButtonText:'Import',
    inputValidator:(v)=> !v ? 'Please enter a URL' : undefined
  });
  if(!userU) return;

  showProcessing('Importing…');
  try{
    let fet = await fetch(userU);
    if(!fet.ok) throw new Error('Request failed');
    let fetCon = await fet.text();
    hideProcessing();
    document.getElementById("pyy").textContent = fetCon;
    document.getElementById("pyy").contentEditable = "true";
  }catch(err){
    hideProcessing();
    toast('error','Import failed','Could not fetch content from that link.');
  }
}
