<script>
  /* Apply saved theme before first paint to avoid a flash of the wrong theme. Default: dark. */
  (function(){
    try{
      var t = localStorage.getItem('fer-theme');
      document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    }catch(e){
      document.documentElement.setAttribute('data-theme','dark');
    }
  })();

<style>
:root,
:root[data-theme="dark"]{
  --ink:#14181f;
  --ink-2:#1b2029;
  --ink-3:#232935;
  --line:#2c3240;
  --paper:#f6f4ee;
  --paper-strip:#efebe0;
  --paper-line:#dcd6c6;
  --paper-hint:#9a9382;
  --text-hi:#f1efe8;
  --text-lo:#8a92a3;
  --text-doc:#1d1c18;
  --text-doc-lo:#6b6455;
  --text-doc-hi:#2b2a25;
  --ember:#b0442f;
  --ember-hi:#c85640;
  --radius:4px;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
  --serif:'Source Serif 4',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}

/* light theme: warm off-white surfaces, never pure #fff */
:root[data-theme="light"]{
  --ink:#eae7dd;
  --ink-2:#f1eee4;
  --ink-3:#e3dfd0;
  --line:#d8d2c0;
  --paper:#faf8f1;

  --paper-line:#ded7c3;
  --paper-hint:#8f8874;
  --text-hi:#2a2924;
  --text-lo:#6e6a5e;
  --text-doc:#211f1a;
  --text-doc-lo:#6b6455;
  --text-doc-hi:#2b2a25;
  --ember:#a83d29;
  --ember-hi:#8f3222;
  --radius:4px;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
  --serif:'Source Serif 4',Georgia,serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}

*{box-sizing:border-box;}

html{
  height:100%;
  -webkit-text-size-adjust:100%;
  text-size-adjust:100%;
  overflow:hidden;
}

body{
  height:100%;
  height:100dvh;
  margin:0;
  background:transparent;
  color:var(--text-hi);
  font-family:var(--sans);
  transition:color .2s ease;
}

body{
  display:flex;
  flex-direction:column;
  overflow:hidden;
  overscroll-behavior:none;
}

#particles-js{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  background:var(--ink);
  transition:background .2s ease;
}

#particles-js canvas{
  display:block;
}

/* keep real UI above the particle layer */
.hea,
.stage,
.foo{
  position:relative;
  z-index:1;
}

/* header */
.hea{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 20px;
  border-bottom:1px solid var(--line);
  background:var(--ink-2);
  flex-wrap:wrap;
  gap:10px;
  flex:0 0 auto;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  text-decoration:none;
  color:var(--text-hi);
  min-width:0;
}

.brand-mark{
  height:28px;
  width:auto;
  display:block;
  object-fit:contain;
  flex-shrink:0;
}

.brand-name{
  font-family:var(--serif);
  font-weight:600;
  font-size:1.15rem;
  letter-spacing:0.01em;
  white-space:nowrap;
}

.toolbar{
  display:flex;
  align-items:center;
  gap:4px;
  flex-shrink:0;
}

.toolbar i{
  width:36px;
  height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:var(--text-lo);
  font-size:0.95rem;
  border:1px solid transparent;
  border-radius:var(--radius);
  cursor:pointer;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  transition:color .15s ease, border-color .15s ease, background .15s ease;
}

.toolbar i:hover{
  color:var(--ember-hi);
  border-color:var(--line);
  background:var(--ink-3);
}

.toolbar i:active{
  color:var(--ember);
}

/* larger, easier-to-hit icons on desktop, where cursor precision isn't a constraint */
@media (min-width:768px){
  .toolbar{gap:6px;}
  .toolbar i{
    width:44px;
    height:44px;
    font-size:1.25rem;
  }
}

/* stage */
.stage{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  width:100%;
  max-width:820px;
  margin:0 auto;
  padding:20px;
  gap:16px;
  position:relative;
  overflow:hidden;
}

/* document card */
.tex{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:var(--paper);
  border:1px solid var(--paper-line);
  border-radius:var(--radius);
  box-shadow:0 1px 0 rgba(0,0,0,.4), 0 20px 40px -24px rgba(0,0,0,.6);

}

.doc-strip{

  align-items:center;
  justify-content:space-between;
  padding:10px 18px;

  background:var(--paper-strip);

.doc-strip .doc-title{

}

.doc-strip .doc-hint{

<script type="text/javascript">

const swalTheme = Swal.mixin({
  customClass:{ popup:'fer-popup' },
  background:'var(--ink-2)',
  color:'var(--text-hi)',
  confirmButtonColor:'#b0442f',
  cancelButtonColor:'#2c3240',
  buttonsStyling:true
});

/* theme: dark (default) / light, persisted in localStorage */
function updateThemeIcon(theme){
  const btn = document.getElementById('themeToggle');
  if(!btn) return;
  btn.className = theme === 'dark' ? 'bi bi-moon-stars-fill' : 'bi bi-sun-fill';
  btn.title = theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme';
}

function toggleTheme(){
  const current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  const next = current === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('fer-theme', next); }catch(e){}
  updateThemeIcon(next);
}

updateThemeIcon(document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark');

function showProcessing(title){
  swalTheme.fire({
    title:title,
    html:`<img src="venom-load.gif" class="fer-load-mark" alt="">
          <div class="fer-progress"><div class="fer-progress-bar" id="ferBar"></div></div>
          <div class="fer-progress-label" id="ferBarLabel">0%</div>`,
    allowOutsideClick:false,
    allowEscapeKey:false,
    showConfirmButton:false
  });
}

/* Drives the progress bar off real chunk counts (done/total) rather than a
   fake timer — called from the chunked encrypt/decrypt loops as each 1 MiB
   chunk finishes. */
function updateProcessingProgress(done, total){
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;
  const bar = document.getElementById('ferBar');
  const label = document.getElementById('ferBarLabel');
  if(bar) bar.style.width = pct + '%';
  if(label) label.textContent = pct + '% (' + done + '/' + total + ' chunks)';
}

function hideProcessing(){
  Swal.close();
}

function toast(icon, title, text){
  swalTheme.fire({icon:icon, title:title, text:text});
}

async function askPassword(title){
  const { value: pw } = await swalTheme.fire({
    title:title,
    icon:'question',
    iconHtml:'<i class="bi bi-shield-lock-fill"></i>',
    iconColor:'#b0442f',
    input:'password',
    inputPlaceholder:'Enter password',
    inputAttributes:{ autocapitalize:'off', autocorrect:'off' },
    showCancelButton:true,
    confirmButtonText:'Continue',
    inputValidator:(v)=> !v ? 'Password cannot be empty' : undefined
  });
  return pw;
}

function speakingUtterance(){ return window.__ferUtterance; }

function spea(x) {
  const media = document.getElementById("audioid") || document.getElementById("videoid");

  if (media) {
    if (x.id === "play") {
      media.play();
      x.id = "pause";
      x.className = "bi bi-pause-fill";
      media.onended = function () {
        x.id = "play";
        x.className = "bi bi-play-fill";
      };
    } else {
      media.pause();
      x.id = "play";
      x.className = "bi bi-play-fill";
    }
    return;
  }

  if (x.id === "play") {
    let sv = document.getElementById("pyy").textContent;
    if(!sv || !sv.trim()){
      toast('info','Nothing to read','Add some text first.');
      return;
    }
    let spp = new SpeechSynthesisUtterance(sv);
    window.__ferUtterance = spp;
    spp.lang = navigator.language || "en-US";
    speechSynthesis.speak(spp);
    x.id = "pause";
    x.className = "bi bi-pause-fill";
    spp.onend = function () {
      x.id = "play";
      x.className = "bi bi-play-fill";
    };
  } else {
    if (speechSynthesis.speaking) {
      speechSynthesis.cancel();
    }
    x.id = "play";
    x.className = "bi bi-play-fill";
  }
}

let pas = "";
let ferPendingFile = null;     // File reference queued for chunked encryption — never read into memory up front
let ferObjectUrl = null;       // tracks the current blob: URL so we can revoke it and avoid leaks

/* --- fast, chunked base64 <-> ArrayBuffer helpers ---
   Chunking avoids call-stack limits and keeps things quick even at 10MB+. */
const FER_B64_CHUNK = 0x8000;

function ferBufToB64(buf){
  const bytes = new Uint8Array(buf);
  let binary = "";
  for(let i=0; i<bytes.length; i+=FER_B64_CHUNK){
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + FER_B64_CHUNK));
  }
  return btoa(binary);
}

function ferB64ToBuf(b64){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0; i<binary.length; i++){ bytes[i] = binary.charCodeAt(i); }
  return bytes.buffer;
}

/* Derive an AES-256-GCM key from the password using PBKDF2 (native, hardware-accelerated). */
async function ferDeriveKey(password, salt, usage){
  const keyMaterial = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]
  );
  return crypto.subtle.deriveKey(
    { name:"PBKDF2", salt:salt, iterations:150000, hash:"SHA-256" },
    keyMaterial,
    { name:"AES-GCM", length:256 },
    false,
    [usage]
  );
}

/* Core: encrypts a raw ArrayBuffer directly. No pre-inflation, no double base64 —
   the ciphertext is base64'd exactly once, for storage as text. */
async function ferEncryptBuf(plainBuf, password, extra){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await ferDeriveKey(password, salt, "encrypt");
  const ct = await crypto.subtle.encrypt({ name:"AES-GCM", iv:iv }, key, plainBuf);
  return JSON.stringify(Object.assign({
    v:2,
    s: ferBufToB64(salt.buffer),
    iv: ferBufToB64(iv.buffer),
    ct: ferBufToB64(ct)
  }, extra || {}));
}

async function ferDecryptBuf(payloadStr, password){
  const payload = JSON.parse(payloadStr);
  const salt = new Uint8Array(ferB64ToBuf(payload.s));
  const iv = new Uint8Array(ferB64ToBuf(payload.iv));
  const ct = ferB64ToBuf(payload.ct);
  const key = await ferDeriveKey(password, salt, "decrypt");
  const plainBuf = await crypto.subtle.decrypt({ name:"AES-GCM", iv:iv }, key, ct);
  return { buf: plainBuf, t: payload.t, mime: payload.mime };
}

/* Text convenience wrappers (used for plain text content) */
async function ferEncrypt(plaintext, password){
  return ferEncryptBuf(new TextEncoder().encode(plaintext), password, { t:'txt' });
}

async function ferDecrypt(payloadStr, password){
  const { buf, t } = await ferDecryptBuf(payloadStr, password);
  if(t && t !== 'txt') throw new Error('not text');
  return new TextDecoder().decode(buf);
}

/* ============================================================
   Chunked binary (.fer) engine — used for image/audio/video files
   and any decrypted .fer file.

   Files are never fully loaded into RAM: the source is read via
   File.slice() in FER_CHUNK_SIZE (1 MiB) pieces, one at a time,
   on both the encrypt and decrypt side. Each chunk gets its own
   random IV and is AES-256-GCM authenticated with AAD that binds
   it to the file header, its index, and the total chunk count —
   so chunks can't be reordered, dropped, or spliced from another
   file without the GCM tag failing to verify. Output is written
   straight to disk via the File System Access API when available,
   or assembled into a Blob otherwise — no base64, and the ciphertext
   never touches the DOM.
   ============================================================ */

const FER_MAGIC = 'FER1';
const FER_VERSION = 3;
const FER_CHUNK_SIZE = 1024 * 1024; // 1 MiB

function ferU32(n){
  const b = new Uint8Array(4);
  new DataView(b.buffer).setUint32(0, n, true);
  return b;
}

function ferReadU32(bytes){
  return new DataView(bytes.buffer, bytes.byteOffset, 4).getUint32(0, true);
}

function ferConcatBytes(...arrs){
  let len = 0;
  for(const a of arrs) len += a.length;
  const out = new Uint8Array(len);
  let o = 0;
  for(const a of arrs){ out.set(a, o); o += a.length; }
  return out;
}

/* Binds a chunk's ciphertext to the exact header bytes, its position, and
   the declared total chunk count. */
function ferChunkAAD(headerBytes, index, count){
  return ferConcatBytes(headerBytes, ferU32(index), ferU32(count));
}

/* Sink that just collects Uint8Array parts for a final Blob — used when
   File System Access isn't available, or when the result needs to stay
   in memory for preview (revealed images/audio/video). */
function ferMakeBlobSink(mimeType){
  const parts = [];
  return {
    write: async (bytes) => { parts.push(bytes); },
    finish: async () => new Blob(parts, { type: mimeType || 'application/octet-stream' }),
    close: async () => {}
  };
}

/* Sink that streams straight to a file on disk — nothing is buffered in
   memory on the output side either. Falls back to null (caller should use
   ferMakeBlobSink instead) if the API is unavailable or the user cancels. */
async function ferMakeFileSink(suggestedName){
  if(!window.showSaveFilePicker) return null;
  try{
    const handle = await window.showSaveFilePicker({ suggestedName });
    const writable = await handle.createWritable();
    return {
      write: async (bytes) => { await writable.write(bytes); },
      finish: async () => null,
      close: async () => { await writable.close(); }
    };
  }catch(err){
    if(err && err.name === 'AbortError') throw err;
    return null;
  }
}

/* Encrypts a File in 1 MiB chunks read straight off disk. */
async function ferEncryptFileChunked(file, password, sink, onProgress){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const key = await ferDeriveKey(password, salt, 'encrypt');
  const chunkCount = Math.max(1, Math.ceil(file.size / FER_CHUNK_SIZE));

  const header = {
    name: file.name,
    mime: file.type || 'application/octet-stream',
    size: file.size,
    chunkSize: FER_CHUNK_SIZE,
    chunkCount: chunkCount
  };
  const headerBytes = new TextEncoder().encode(JSON.stringify(header));

  await sink.write(new TextEncoder().encode(FER_MAGIC));
  await sink.write(new Uint8Array([FER_VERSION]));
  await sink.write(ferU32(headerBytes.length));
  await sink.write(headerBytes);
  await sink.write(salt);

  for(let i=0; i<chunkCount; i++){
    const start = i * FER_CHUNK_SIZE;
    const end = Math.min(start + FER_CHUNK_SIZE, file.size);
    const plainChunk = await file.slice(start, end).arrayBuffer();
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const aad = ferChunkAAD(headerBytes, i, chunkCount);
    const ctBuf = await crypto.subtle.encrypt({ name:'AES-GCM', iv, additionalData: aad }, key, plainChunk);
    const ctBytes = new Uint8Array(ctBuf);

    await sink.write(iv);
    await sink.write(ferU32(ctBytes.length));
    await sink.write(ctBytes);

    if(onProgress) onProgress(i + 1, chunkCount);
    if(i % 4 === 3) await new Promise(r => setTimeout(r, 0)); // keep UI responsive
  }

  return sink.finish();
}

/* Decrypts a .fer File in the same 1 MiB-aligned chunks it was written in.
   Every chunk's AAD is re-verified on decrypt, and the total decrypted size
   is checked against the header, so a truncated, reordered or tampered
   file is rejected instead of silently accepted. */
async function ferDecryptFileChunked(file, password, sink, onProgress){
  let offset = 0;
  const readBytes = async (n) => {
    const buf = await file.slice(offset, offset + n).arrayBuffer();
    offset += n;
    if(buf.byteLength !== n) throw new Error('Unexpected end of file');
    return new Uint8Array(buf);
  };

  const magic = await readBytes(4);
  if(new TextDecoder().decode(magic) !== FER_MAGIC) throw new Error('Not a Ferdinand (.fer) file');
  const version = (await readBytes(1))[0];
  if(version !== FER_VERSION) throw new Error('Unsupported .fer version');

  const headerLen = ferReadU32(await readBytes(4));
  const headerBytes = await readBytes(headerLen);
  const header = JSON.parse(new TextDecoder().decode(headerBytes));
  const salt = await readBytes(16);
  const key = await ferDeriveKey(password, salt, 'decrypt');

  let totalOut = 0;
  for(let i=0; i<header.chunkCount; i++){
    const iv = await readBytes(12);
    const ctLen = ferReadU32(await readBytes(4));
    const ctBytes = await readBytes(ctLen);
    const aad = ferChunkAAD(headerBytes, i, header.chunkCount);
    let plainBuf;
    try{
      plainBuf = await crypto.subtle.decrypt({ name:'AES-GCM', iv, additionalData: aad }, key, ctBytes);
    }catch(err){
      throw new Error('Incorrect password or corrupted file');
    }
    await sink.write(new Uint8Array(plainBuf));
    totalOut += plainBuf.byteLength;

    if(onProgress) onProgress(i + 1, header.chunkCount);
    if(i % 4 === 3) await new Promise(r => setTimeout(r, 0));
  }

  if(totalOut !== header.size) throw new Error('File is incomplete or was tampered with');

  const outBlob = await sink.finish();
  return { blob: outBlob, name: header.name, mime: header.mime };
}

function ferHumanSize(bytes){
  if(bytes < 1024) return bytes + ' B';
  const units = ['KB','MB','GB','TB'];
  let u = -1;
  do { bytes /= 1024; u++; } while(bytes >= 1024 && u < units.length - 1);
  return bytes.toFixed(1) + ' ' + units[u];
}

function ferShowFileReady(file){
  const p = document.getElementById('pyy');
  p.textContent = '';
  const card = document.createElement('div');
  card.className = 'fer-file-card';
  card.innerHTML = `<i class="bi bi-file-earmark-lock2"></i>
    <div class="fer-file-info">
      <div class="fer-file-name"></div>
      <div class="fer-file-meta"></div>
    </div>`;
  card.querySelector('.fer-file-name').textContent = file.name;
  card.querySelector('.fer-file-meta').textContent = ferHumanSize(file.size);
  p.appendChild(card);
}

function ferShowFileEncrypted(outName, blob, savedToDisk){
  const p = document.getElementById('pyy');
  p.textContent = '';
  const card = document.createElement('div');
  card.className = 'fer-file-card fer-file-card-done';
  card.innerHTML = `<i class="bi bi-shield-lock-fill"></i>
    <div class="fer-file-info">
      <div class="fer-file-name"></div>
      <div class="fer-file-meta"></div>
    </div>`;
  card.querySelector('.fer-file-name').textContent = outName;
  card.querySelector('.fer-file-meta').textContent = savedToDisk ? 'Saved to disk' : 'Encrypted — ready to download';
  p.appendChild(card);

  if(!savedToDisk && blob){
    const dl = document.createElement('button');
    dl.type = 'button';
    dl.className = 'btn btn-primary fer-file-download';
    dl.innerHTML = '<i class="bi bi-download"></i> Download .fer';
    dl.onclick = ()=>{
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = outName; a.click();
      URL.revokeObjectURL(url);
    };
    p.appendChild(dl);
  }
}

async function ferEncryptPendingFile(){
  const file = ferPendingFile;
  const password = pas;
  const outName = file.name.replace(/\.[^.]*$/, '') + '.fer';

  let sink;
  let streamedToDisk = false;
  try{
    sink = await ferMakeFileSink(outName);
    streamedToDisk = !!sink;
    if(!sink) sink = ferMakeBlobSink('application/octet-stream');

    const blob = await ferEncryptFileChunked(file, password, sink, (done, total)=>{
      updateProcessingProgress(done, total);
    });
    if(sink.close) await sink.close();

    hideProcessing();
    pas = "";
    ferPendingFile = null;
    ferShowFileEncrypted(outName, blob, streamedToDisk);
    if(streamedToDisk) toast('success','Saved','Encrypted file saved to disk.');
  }catch(err){
    hideProcessing();
    pas = "";
    ferPendingFile = null;
    if(err && err.name === 'AbortError') return; // user cancelled the save dialog
    toast('error','Concealing failed','Something went wrong while concealing this file.');
  }
}

async function ferRevealFile(file){
  const pw = await askPassword('Enter the password to reveal');
  if(!pw){ return; }
  pas = pw;

  document.getElementById("inpp").querySelectorAll('.btn').forEach(b=>b.disabled=true);
  showProcessing('Revealing…');
  await new Promise(r=>setTimeout(r, 50));

  let result;
  try{
    const sink = ferMakeBlobSink();
    result = await ferDecryptFileChunked(file, pas, sink, (done, total)=>{
      updateProcessingProgress(done, total);
    });
  }catch(err){
    hideProcessing();
    pas = "";
    document.getElementById("inpp").querySelectorAll('.btn').forEach(b=>b.disabled=false);
    toast('error','Incorrect password','This file could not be revealed.');
    return;
  }

  hideProcessing();
  pas = "";
  document.getElementById("inpp").querySelectorAll('.btn').forEach(b=>b.disabled=false);

  if (speechSynthesis.speaking) { speechSynthesis.cancel(); }
  const prevMedia = document.getElementById("audioid") || document.getElementById("videoid");
  if (prevMedia) { prevMedia.pause(); }
  const playBtn = document.getElementById("play") || document.getElementById("pause");
  if (playBtn) { playBtn.id = "play"; playBtn.className = "bi bi-play-fill"; }
  if(ferObjectUrl){ URL.revokeObjectURL(ferObjectUrl); ferObjectUrl = null; }

  const p = document.getElementById("pyy");
  p.textContent = '';
  p.contentEditable = 'false';

  const typedBlob = result.blob.slice(0, result.blob.size, result.mime);
  ferObjectUrl = URL.createObjectURL(typedBlob);

  if(result.mime.startsWith('image/')){
    let ie = document.createElement('img');
    ie.src = ferObjectUrl;
    p.appendChild(ie);
  } else if(result.mime.startsWith('audio/')){
    let amark = document.createElement('div');
    amark.className = 'fer-audio-mark';
    amark.innerHTML = '<i class="bi bi-music-note-beamed"></i>';
    p.appendChild(amark);
    let iae = document.createElement('audio');
    iae.id = 'audioid'; iae.src = ferObjectUrl; iae.controls = false;
    p.appendChild(iae);
  } else if(result.mime.startsWith('video/')){
    let ive = document.createElement('video');
    ive.id = 'videoid'; ive.src = ferObjectUrl; ive.controls = false;
    p.appendChild(ive);
  } else {
    ferShowFileEncrypted(result.name, null, false);
    p.querySelector('.fer-file-meta').textContent = 'Revealed — ready to download';
    p.querySelector('.fer-file-card i').className = 'bi bi-file-earmark-check';
  }

  const dl = document.createElement('button');
  dl.type = 'button';
  dl.className = 'btn btn-secondary fer-file-download';
  dl.innerHTML = '<i class="bi bi-download"></i> Download original';
  dl.onclick = ()=>{
    const a = document.createElement('a');
    a.href = ferObjectUrl; a.download = result.name; a.click();
  };
  p.appendChild(dl);
}

async function ennx(x){
  const title = x === 'e' ? 'Enter a password to conceal' : 'Enter the password to reveal';
  const pw = await askPassword(title);
  if(!pw){ return; }
  pas = pw;

  document.getElementById("inpp").querySelectorAll('.btn').forEach(b=>b.disabled=true);
  showProcessing(x === 'e' ? 'Concealing…' : 'Revealing…');

  /* brief yield so the modal paints before the (now fast, async, non-blocking) crypto work runs */
  await new Promise(r=>setTimeout(r, 50));

  try{
    if(x === 'e'){ await enn(); } else { await ddd(); }
  } finally {
    document.getElementById("inpp").querySelectorAll('.btn').forEach(b=>b.disabled=false);
  }
}

document.getElementById("ii").addEventListener("change", (e)=>{
  let ff = e.target.files[0];
  if(!ff) return;

  if (speechSynthesis.speaking) { speechSynthesis.cancel(); }
  const prevMedia = document.getElementById("audioid") || document.getElementById("videoid");
  if (prevMedia) { prevMedia.pause(); }
  const playBtn = document.getElementById("play") || document.getElementById("pause");
  if (playBtn) { playBtn.id = "play"; playBtn.className = "bi bi-play-fill"; }
  if(ferObjectUrl){ URL.revokeObjectURL(ferObjectUrl); ferObjectUrl = null; }
  ferPendingFile = null;

  const isFerFile = ff.name.toLowerCase().endsWith('.fer');

  if(isFerFile){
    /* An encrypted Ferdinand file — decrypted straight off disk, chunk by chunk. */
    document.getElementById("pyy").contentEditable = "false";
    ferRevealFile(ff);

  } else if(ff.type.includes("text")){
    /* Text is still read fully so it can be edited in place — no size cap either way. */
    document.getElementById("pyy").contentEditable = "true";
    let fi = new FileReader();
    fi.onload = (e)=>{
      document.getElementById("pyy").textContent = e.target.result;
    };
    fi.readAsText(ff);
    document.getElementById("pyy").textContent = "Reading file contents…";

  } else if(ff.type.includes("image") || ff.type.includes("audio") || ff.type.includes("video")){
    /* Kept only as a File reference — nothing is read into memory here.
       Encryption streams the bytes straight off disk in 1 MiB chunks. */
    document.getElementById("pyy").contentEditable = "false";
    ferPendingFile = ff;
    ferShowFileReady(ff);
    ennx("e");

  } else {
    toast('warning','Unsupported file type','Ferdinand supports text, image, audio and video files (and .fer encrypted files) only.');
  }

  e.target.value = "";
});

async function enn(){
  if(ferPendingFile){
    await ferEncryptPendingFile();
    return;
  }
  let encoded;
  try{
    let ddt = document.getElementById("pyy").textContent;
    encoded = await ferEncrypt(ddt, pas);
  }catch(err){
    hideProcessing();
    pas = "";
    toast('error','Concealing failed','Something went wrong while concealing this content.');
    return;
  }
  hideProcessing();
  document.getElementById("pyy").textContent = encoded;
  pas = "";
}

async function ddd(){
  let ddt = document.getElementById("pyy").textContent;
  let result;
  try{
    result = await ferDecryptBuf(ddt, pas);
    if(!result || !result.buf) throw new Error('empty');
  }catch(err){
    hideProcessing();
    pas = "";
    toast('error','Incorrect password','This content could not be revealed.');
    return;
  }

  hideProcessing();
  pas = "";

  if (speechSynthesis.speaking) { speechSynthesis.cancel(); }
  const prevMedia = document.getElementById("audioid") || document.getElementById("videoid");
  if (prevMedia) { prevMedia.pause(); }
  const playBtn = document.getElementById("play") || document.getElementById("pause");
  if (playBtn) { playBtn.id = "play"; playBtn.className = "bi bi-play-fill"; }

  /* release any previous blob: URL before creating a new one */
  if(ferObjectUrl){ URL.revokeObjectURL(ferObjectUrl); ferObjectUrl = null; }

  document.getElementById("pyy").textContent = "";
  document.getElementById("pyy").contentEditable = "true";

  if(result.t === 'bin' && result.mime){
    const blob = new Blob([result.buf], { type: result.mime });
    ferObjectUrl = URL.createObjectURL(blob);

    if(result.mime.startsWith("image/")){
      let ie = document.createElement("img");
      ie.src = ferObjectUrl;
      document.getElementById("pyy").appendChild(ie);
      document.getElementById("pyy").contentEditable = "false";

    } else if(result.mime.startsWith("audio/")){
      let amark = document.createElement("div");
      amark.className = "fer-audio-mark";
      amark.innerHTML = '<i class="bi bi-music-note-beamed"></i>';
      document.getElementById("pyy").appendChild(amark);

      let iae = document.createElement("audio");
      iae.id = "audioid";
      iae.src = ferObjectUrl;
      iae.controls = false;
      document.getElementById("pyy").appendChild(iae);
      document.getElementById("pyy").contentEditable = "false";

    } else if(result.mime.startsWith("video/")){
      let ive = document.createElement("video");
      ive.id = "videoid";
      ive.src = ferObjectUrl;
      ive.controls = false;
      document.getElementById("pyy").appendChild(ive);
      document.getElementById("pyy").contentEditable = "false";
    }

  } else {
    document.getElementById("pyy").textContent = new TextDecoder().decode(result.buf);
  }
}

async function pri(){
  let con = document.getElementById("pyy").textContent;
  if(!con || !con.trim()){
    toast('info','Nothing to download','Add some content first.');
    return;
  }
  const { value: fina } = await swalTheme.fire({
    title:'Download file',
    icon:'question',
    iconHtml:'<i class="bi bi-download"></i>',
    iconColor:'#b0442f',
    input:'text',
    inputValue:'ferdinand.txt',
    showCancelButton:true,
    confirmButtonText:'Download',
    inputValidator:(v)=> !v ? 'Please enter a file name' : undefined
  });
  if(!fina) return;

  let bb = new Blob([con], {type:"text/plain"});
  let xx = document.createElement("a");
  xx.href = URL.createObjectURL(bb);
  xx.download = fina;
  xx.click();
  URL.revokeObjectURL(xx.href);
}

async function shr(x) {
  let con = document.getElementById("pyy").textContent;
  if(!con || !con.trim()){
    toast('info','Nothing to share','Add some content first.');
    return;
  }
  if(!navigator.share){
    toast('info','Sharing unavailable','Your browser does not support the Share feature.');
    return;
  }
  try{
    if(x === 'fs'){
      let bb = new Blob([con], { type:"text/plain" });
      let file = new File([bb], "ferdinand.txt", { type:"text/plain" });
      await navigator.share({ files:[file] });
    } else {
      await navigator.share({ text:con });
    }
  }catch(err){
    /* user cancelled the share sheet — nothing to do */
  }
}

/* --- animated particle background --- */
function ferParticleColors(theme){
  return theme === 'light'
    ? { particle:'#a83d29', line:'#8f8874' }
    : { particle:'#c85640', line:'#4a5265' };
}

function initFerParticles(theme){
  if(typeof particlesJS === 'undefined') return;
  const c = ferParticleColors(theme);
  particlesJS('particles-js', {
    particles:{
      number:{ value:60, density:{ enable:true, value_area:900 } },
      color:{ value:c.particle },
      shape:{ type:'circle' },
      opacity:{ value:0.45, random:true, anim:{ enable:true, speed:0.4, opacity_min:0.1, sync:false } },
      size:{ value:2.5, random:true },
      line_linked:{ enable:true, distance:130, color:c.line, opacity:0.35, width:1 },
      move:{ enable:true, speed:1, direction:'none', random:true, straight:false, out_mode:'out', bounce:false }
    },
    interactivity:{
      detect_on:'canvas',
      events:{
        onhover:{ enable:true, mode:'grab' },
        onclick:{ enable:true, mode:'push' },
        resize:true
      },
      modes:{
        grab:{ distance:140, line_linked:{ opacity:0.6 } },
        push:{ particles_nb:3 }
      }
    },
    retina_detect:true
  });
}

initFerParticles(document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark');

/* re-theme particles whenever the user switches dark/light */
const ferOrigToggleTheme = toggleTheme;
toggleTheme = function(){
  ferOrigToggleTheme();
  const t = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  if(window.pJSDom && window.pJSDom.length){
    window.pJSDom.forEach(p => p.pJS.fn.vendors.destroypJS());
    window.pJSDom = [];
  }
  initFerParticles(t);
};

async function impo(){
  const { value: userU } = await swalTheme.fire({
    title:'Import from link',
    icon:'question',
    iconHtml:'<i class="bi bi-link-45deg"></i>',
    iconColor:'#b0442f',
    input:'url',
    inputPlaceholder:'https://example.com/file.txt',
    showCancelButton:true,
    confirmButtonText:'Import',
    inputValidator:(v)=> !v ? 'Please enter a URL' : undefined
  });
  if(!userU) return;

  showProcessing('Importing…');
  try{
    let fet = await fetch(userU);
    if(!fet.ok) throw new Error('Request failed');
    let fetCon = await fet.text();
    hideProcessing();
    document.getElementById("pyy").textContent = fetCon;
    document.getElementById("pyy").contentEditable = "true";
  }catch(err){
    hideProcessing();
    toast('error','Import failed','Could not fetch content from that link.');
  }
}
